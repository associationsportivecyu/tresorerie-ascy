<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trésorerie AS CY</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&display=swap">
<style>
  /* Même identité que le site d'inscription : fond bleu tramé, médaillon, panneaux marine à barre de couleur */
  :root {
    --bleu: #1f5ee6;
    --bleu-clair: #3a78f5;
    --marine: #17246b;
    --marine-2: #1d2c7d;
    --jaune: #f5c518;
    --vert: #22c983;
    --rouge: #ef5a4c;
    --rouge-clair: #ff9388;
    --violet: #5b6cff;
    --blanc: #ffffff;
    --doux: #c9d4ff;
    --err: #ffb4ab;
    --trait: rgba(255,255,255,.22);
    --f: "Montserrat", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bleu); }
  body {
    margin: 0; min-height: 100vh; color: var(--blanc);
    font: 500 15px/1.5 var(--f);
    background:
      radial-gradient(rgba(255,255,255,.13) 1.2px, transparent 1.4px) 0 0 / 14px 14px,
      radial-gradient(120% 60% at 15% 10%, rgba(255,255,255,.14), transparent 60%),
      radial-gradient(90% 50% at 90% 70%, rgba(10,30,120,.35), transparent 70%),
      linear-gradient(160deg, var(--bleu-clair), var(--bleu) 45%, #1a52d4);
    background-attachment: fixed;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--jaune); outline-offset: 2px; }
  h1, h2 { margin: 0; line-height: 1.2; }

  /* En-tête */
  .entete { display: flex; align-items: center; gap: 22px; }
  .medaillon {
    flex: none; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center;
    background:
      radial-gradient(rgba(245,197,24,.85) 1.6px, transparent 1.9px) 0 0 / 9px 9px,
      var(--vert);
  }
  .medaillon img { width: 84px; height: auto; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
  .titre { font: 900 64px/.9 var(--f); letter-spacing: -.02em; text-shadow: 5px 5px 0 var(--marine); }
  .accroche {
    margin: 0; padding-left: 14px; border-left: 5px solid var(--jaune);
    font: italic 800 18px/1.3 var(--f); text-wrap: balance;
  }
  .accroche span { color: var(--jaune); }

  /* Connexion */
  .connexion { min-height: 100vh; display: grid; align-content: center; justify-content: center; grid-template-columns: min(100%, 460px); padding: 24px 16px; }
  .page { display: grid; gap: 18px; min-width: 0; }
  #bouton-google { display: flex; justify-content: center; min-height: 44px; color-scheme: light; } /* évite un cadre blanc autour du bouton Google */
  .message-connexion, .erreur { margin: 0; padding: 10px 12px; background: var(--marine); color: var(--err); font-weight: 700; font-size: 14px; border-radius: 4px; overflow-wrap: anywhere; }

  /* Panneaux */
  .panneau, .tuile, .filtres, .saisie, .form-acces, .acces, .ligne-histo {
    background: color-mix(in srgb, var(--marine) 94%, transparent);
  }
  .panneau { border-top: 5px solid var(--c, var(--jaune)); padding: 20px; display: grid; gap: 14px; min-width: 0; }
  .panneau h2 { font: 900 17px/1.15 var(--f); text-transform: uppercase; letter-spacing: .02em; }

  /* Application */
  .haut { max-width: 860px; margin: 0 auto; padding: 22px 16px 0; display: grid; gap: 16px; }
  .compacte { gap: 14px; }
  .compacte .medaillon { width: 76px; height: 76px; }
  .compacte .medaillon img { width: 48px; }
  .compacte .titre { font-size: 40px; text-shadow: 3px 3px 0 var(--marine); margin-bottom: 7px; }
  .compacte .accroche { font-size: 14px; padding-left: 10px; border-left-width: 4px; }
  .compacte .accroche small { display: block; font: 600 12.5px/1.3 var(--f); color: var(--blanc); overflow-wrap: anywhere; }
  .compacte .fin { margin-left: auto; }
  .lien-clair { flex: none; background: var(--marine); border: 0; color: var(--blanc); border-radius: 4px; padding: 8px 11px; font-size: 13px; font-weight: 700; }
  nav { display: flex; flex-wrap: wrap; gap: 7px; }
  nav button { min-height: 40px; background: var(--marine); border: 0; border-radius: 4px; color: var(--doux); padding: 7px 14px; font-weight: 800; }
  nav button[aria-current="page"] { background: var(--jaune); color: var(--marine); }

  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 96px; }
  .tuiles { display: grid; gap: 10px; }
  .tuile { border-top: 5px solid var(--c); padding: 13px 16px; min-width: 0; }
  .tuile span { display: block; font: 800 12px/1.3 var(--f); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
  .tuile strong { display: block; font: 900 22px/1.25 var(--f); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tuile.solde { background: var(--jaune); color: var(--marine); border-top: 0; padding: 16px 20px; }
  .tuile.solde span { color: var(--marine); }
  .tuile.solde strong { font-size: 34px; line-height: 1.15; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .filtres { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; margin: 14px 0; padding: 12px; }
  input, select { width: 100%; min-height: 44px; padding: 9px 11px; background: rgba(255,255,255,.07); border: 1.5px solid var(--trait); border-radius: 6px; }
  input:focus, select:focus { outline: none; border-color: var(--jaune); box-shadow: 0 0 0 3px rgba(245,197,24,.3); }
  option { background: var(--marine); color: var(--blanc); }
  input::placeholder { color: var(--doux); }
  .secondaire { min-height: 44px; padding: 9px 13px; background: rgba(255,255,255,.07); border: 1.5px solid var(--trait); border-radius: 4px; font-weight: 700; color: var(--blanc); }
  .secondaire:hover { border-color: rgba(255,255,255,.5); }
  .principal {
    min-height: 46px; padding: 10px 18px; background: var(--jaune); border: 0; border-radius: 4px;
    font: 900 15px/1.1 var(--f); letter-spacing: .04em; text-transform: uppercase; color: var(--marine);
  }
  .principal:focus-visible { outline-color: var(--blanc); }
  .principal:disabled { opacity: .65; cursor: wait; }
  .danger { color: var(--rouge-clair); border-color: rgba(255,147,136,.5); }

  .saisie { border-left: 6px solid var(--c); padding: 13px 14px; margin-bottom: 9px; }
  .saisie-recette { --c: var(--vert); }
  .saisie-depense { --c: var(--rouge); }
  .saisie-haut { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .saisie h2 { font-size: 15.5px; font-weight: 800; overflow-wrap: anywhere; }
  .montant { font-weight: 900; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .recette { color: var(--vert); }
  .depense { color: var(--rouge-clair); }
  .infos { color: var(--doux); font-size: 13px; margin-top: 2px; }
  .auteur { font-size: 13px; font-weight: 600; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--trait); }
  .auteur em { display: block; font-style: normal; font-weight: 500; color: var(--doux); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .actions button { min-height: 38px; padding: 5px 11px; font-size: 13px; }
  .vide { text-align: center; font-weight: 700; padding: 34px 16px; }

  .ajouter { position: fixed; right: max(16px, calc(50vw - 414px)); bottom: 18px; box-shadow: 4px 4px 0 var(--marine); }

  dialog { width: min(calc(100vw - 24px), 500px); max-height: calc(100dvh - 24px); border: 0; border-top: 5px solid var(--jaune); padding: 20px; background: var(--marine); color: var(--blanc); }
  dialog::backdrop { background: rgba(10, 18, 70, .7); }
  dialog h2 { font: 900 19px/1.2 var(--f); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 12px; }
  label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 11px; }
  label input, label select { margin-top: 4px; font-weight: 500; }
  .aide { display: block; margin: 0; color: var(--doux); font-weight: 500; font-size: 13px; }
  label .aide { margin-top: 3px; }
  .bascule { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; border: 0; padding: 0; margin: 0 0 12px; }
  .bascule legend { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  .bascule label { margin: 0; }
  .bascule input { position: absolute; opacity: 0; width: 1px; min-height: 0; }
  .bascule span { display: block; text-align: center; padding: 10px; background: rgba(255,255,255,.07); border: 1.5px solid var(--trait); border-radius: 4px; font-size: 15px; cursor: pointer; }
  .bascule input:checked + span { background: var(--jaune); border-color: var(--jaune); color: var(--marine); }
  .bascule input:focus-visible + span { outline: 2px solid var(--blanc); outline-offset: 2px; }
  .pied { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #apercu { display: block; max-width: 100%; max-height: 70dvh; margin: 0 auto 12px; }

  .acces { display: grid; grid-template-columns: 1fr 130px auto; gap: 8px 12px; align-items: center; padding: 12px 14px; margin-bottom: 8px; }
  .acces strong { display: block; }
  .acces small { color: var(--doux); overflow-wrap: anywhere; }
  .form-acces { display: grid; grid-template-columns: 1.3fr 1fr auto auto; gap: 8px; align-items: end; border-top: 5px solid var(--jaune); padding: 12px 14px; margin-bottom: 14px; }
  .form-acces label { margin: 0; }
  .ligne-histo { padding: 9px 12px; margin-bottom: 6px; font-size: 13.5px; overflow-wrap: anywhere; }
  .ligne-histo small { display: block; color: var(--doux); }

  @media (max-width: 620px) {
    .filtres { grid-template-columns: 1fr 1fr; }
    .filtres .recherche { grid-column: 1 / -1; }
    .filtres .secondaire { grid-column: 1 / -1; }
    .form-acces { grid-template-columns: 1fr; }
    .acces { grid-template-columns: 1fr 130px; }
    .acces button { grid-column: 1 / -1; }
    .ajouter { left: 16px; right: 16px; }
  }
  @media (max-width: 460px) {
    .connexion .medaillon { width: 96px; height: 96px; }
    .connexion .medaillon img { width: 60px; }
    .connexion .titre { font-size: 48px; text-shadow: 4px 4px 0 var(--marine); }
    .connexion .accroche { font-size: 16px; }
    .compacte .medaillon { width: 60px; height: 60px; }
    .compacte .medaillon img { width: 38px; }
    .compacte .titre { font-size: 32px; }
    .tuile strong { font-size: 19px; }
  }
</style>
</head>
<body>

<section class="connexion" id="ecran-connexion" hidden>
  <div class="page">
    <header class="entete">
      <div class="medaillon"><img src="logo.png" alt="Logo de l'AS CY"></div>
      <h1 class="titre">AS<br>CY</h1>
    </header>
    <p class="accroche">Toute la <span>trésorerie de l'AS CY</span></p>
    <div class="panneau">
      <h2>Connexion</h2>
      <p class="aide">Connecte-toi avec ton compte Google autorisé.</p>
      <div id="bouton-google"></div>
      <p class="message-connexion" id="message-connexion" role="alert" hidden></p>
    </div>
  </div>
</section>

<div id="ecran-app" hidden>
  <header class="haut">
    <div class="entete compacte">
      <div class="medaillon"><img src="logo.png" alt=""></div>
      <div>
        <h1 class="titre">AS CY</h1>
        <p class="accroche"><span>Trésorerie</span><small id="bonjour"></small></p>
      </div>
      <button class="lien-clair fin" id="btn-deconnexion">Déconnexion</button>
    </div>
    <nav id="navigation" aria-label="Sections">
      <button data-vue="saisies" aria-current="page">Saisies</button>
      <button data-vue="acces" class="admin" hidden>Accès</button>
      <button data-vue="historique" class="admin" hidden>Historique</button>
    </nav>
  </header>

  <main>
    <section id="vue-saisies">
      <div class="tuiles">
        <div class="tuile solde"><span>Solde actuel</span><strong id="solde">–</strong></div>
        <div class="deux">
          <div class="tuile" style="--c: var(--vert)"><span id="titre-recettes">Recettes</span><strong class="recette" id="recettes">–</strong></div>
          <div class="tuile" style="--c: var(--rouge)"><span id="titre-depenses">Dépenses</span><strong class="depense" id="depenses">–</strong></div>
        </div>
      </div>
      <div class="filtres">
        <input class="recherche" id="recherche" type="search" placeholder="Rechercher…" aria-label="Rechercher une saisie">
        <select id="filtre-type" aria-label="Filtrer par type">
          <option value="">Tout</option>
          <option value="recette">Recettes</option>
          <option value="depense">Dépenses</option>
        </select>
        <select id="filtre-mois" aria-label="Filtrer par mois"></select>
        <button class="secondaire" id="btn-export">Exporter</button>
      </div>
      <div id="liste" aria-live="polite"><p class="vide">Chargement des saisies…</p></div>
      <button class="principal ajouter" id="btn-ajouter">+ Nouvelle saisie</button>
    </section>

    <section id="vue-acces" hidden>
      <form class="form-acces" id="form-acces">
        <label>E-mail Google<input name="email" type="email" required autocomplete="off"></label>
        <label>Nom affiché<input name="nom" required maxlength="60" autocomplete="off"></label>
        <label>Rôle
          <select name="role"><option value="membre">Membre</option><option value="admin">Admin</option></select>
        </label>
        <button class="principal">Ajouter</button>
      </form>
      <p class="erreur" id="erreur-acces" role="alert" hidden></p>
      <div id="liste-acces"></div>
    </section>

    <section id="vue-historique" hidden>
      <div id="liste-historique"></div>
    </section>
  </main>
</div>

<dialog id="dlg-saisie">
  <form id="form-saisie" novalidate>
    <h2 id="titre-saisie">Nouvelle saisie</h2>
    <fieldset class="bascule">
      <legend>Type</legend>
      <label><input type="radio" name="type" value="depense" checked><span>Dépense</span></label>
      <label><input type="radio" name="type" value="recette"><span>Recette</span></label>
    </fieldset>
    <label>Montant (€)<input name="montant" inputmode="decimal" autocomplete="off" placeholder="0,00" required></label>
    <label>Date<input name="date" type="date" required></label>
    <label>Catégorie<select name="categorie" required></select></label>
    <label>Description<input name="description" maxlength="200" autocomplete="off" required></label>
    <label>Moyen de paiement<select name="moyen" required></select></label>
    <label>Justificatif
      <input name="fichier" type="file" accept="image/*,application/pdf">
      <span class="aide" id="aide-fichier">Photo du ticket ou de la facture, ou PDF (5 Mo maximum).</span>
    </label>
    <p class="erreur" id="erreur-saisie" role="alert" hidden></p>
    <div class="pied">
      <button type="button" class="secondaire" id="btn-annuler">Annuler</button>
      <button class="principal" id="btn-enregistrer">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-justificatif">
  <h2>Justificatif</h2>
  <p class="vide" id="chargement-justif">Chargement…</p>
  <img id="apercu" alt="Justificatif de la saisie" hidden>
  <div class="pied">
    <a class="secondaire" id="lien-justif" target="_blank" rel="noopener" hidden style="text-decoration:none;display:inline-flex;align-items:center">Ouvrir le fichier</a>
    <button class="principal" id="btn-fermer-justif">Fermer</button>
  </div>
</dialog>

<script>
  // ====== À PERSONNALISER ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbzQzbtQkUjHqRe1zGOENDeGy_nkmEK7huP9hdZ1f5XrDmSZ1AsqSrIN3WVjIzOlQ56rbQ/exec';
  const CLIENT_ID = '488844381032-9c0kj0u2duis6ur18v3433lg06hpskb2.apps.googleusercontent.com';
  // =============================

  const CLE_SESSION = 'tresorerie-session';
  const RAFRAICHISSEMENT = 60000;
  const TAILLE_MAX_FICHIER = 5 * 1024 * 1024;
  const COTE_MAX_PHOTO = 1600;
  const EXCELJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
  const EXCELJS_EMPREINTE = 'sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz';
  const FORMAT_EUROS = '#,##0.00 [$€-40C];[Red]-#,##0.00 [$€-40C]';
  const SECTIONS_EXPORT = [
    { type: 'recette', titre: 'RECETTES', fonce: '166534', clair: 'DCFCE7', colonne: 3 },
    { type: 'depense', titre: 'DÉPENSES', fonce: '991B1B', clair: 'FEE2E2', colonne: 4 }
  ];
  const COULEUR_AUTRE = { fonce: '57534E', clair: 'F5F5F4' };
  const COULEURS_CATEGORIES = {
    'Solde de départ': { fonce: '1E3A8A', clair: 'DBEAFE' },
    'Cotisations': { fonce: '15803D', clair: 'DCFCE7' },
    'Subventions': { fonce: '0F766E', clair: 'CCFBF1' },
    'Sponsors': { fonce: '0369A1', clair: 'E0F2FE' },
    'Événements': { fonce: '4338CA', clair: 'E0E7FF' },
    'Autre recette': { fonce: '7E22CE', clair: 'F3E8FF' },
    'Compétitions': { fonce: 'B91C1C', clair: 'FEE2E2' },
    'Déplacements': { fonce: 'C2410C', clair: 'FFEDD5' },
    'Hébergement': { fonce: 'A16207', clair: 'FEF9C3' },
    'Restauration': { fonce: 'BE185D', clair: 'FCE7F3' },
    'Matériel': { fonce: '4D7C0F', clair: 'ECFCCB' },
    'Frais bancaires': { fonce: '334155', clair: 'E2E8F0' },
    'Autre dépense': COULEUR_AUTRE
  };

  const $ = id => document.getElementById(id);
  const euros = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
  const etat = { session: lireSession(), moi: null, saisies: [], categories: {}, moyens: [], enEdition: null };

  function lireSession() {
    try { return localStorage.getItem(CLE_SESSION); } catch (e) { return null; }
  }
  function ecrireSession(valeur) {
    etat.session = valeur;
    try {
      if (valeur) localStorage.setItem(CLE_SESSION, valeur);
      else localStorage.removeItem(CLE_SESSION);
    } catch (e) { /* la session dure alors le temps de la page */ }
  }

  function el(balise, proprietes, ...enfants) {
    const noeud = document.createElement(balise);
    Object.assign(noeud, proprietes);
    noeud.append(...enfants.filter(e => e !== null && e !== undefined));
    return noeud;
  }

  async function api(action, donnees) {
    const reponse = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // évite la requête préalable refusée par Apps Script
      body: JSON.stringify({ action, session: etat.session, ...donnees })
    });
    const r = await reponse.json();
    if (r.expiree) {
      afficherConnexion('Ta session a expiré. Reconnecte-toi.');
      throw new Error(r.erreur);
    }
    if (!r.ok) throw new Error(r.erreur);
    return r;
  }

  // ====== Connexion ======

  function afficherConnexion(message) {
    ecrireSession(null);
    clearInterval(etat.minuteur);
    $('ecran-app').hidden = true;
    $('ecran-connexion').hidden = false;
    $('message-connexion').textContent = message || '';
    $('message-connexion').hidden = !message;
    preparerGoogle();
  }

  function preparerGoogle() {
    if (!window.google || !google.accounts) { setTimeout(preparerGoogle, 150); return; }
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: surConnexionGoogle });
    google.accounts.id.renderButton($('bouton-google'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'fr' });
  }

  async function surConnexionGoogle(reponse) {
    $('message-connexion').hidden = true;
    try {
      const r = await api('connexion', { credential: reponse.credential });
      ecrireSession(r.session);
      await demarrer();
    } catch (err) {
      afficherConnexion(err.message);
    }
  }

  async function demarrer() {
    await charger();
    $('ecran-connexion').hidden = true;
    $('ecran-app').hidden = false;
    clearInterval(etat.minuteur);
    etat.minuteur = setInterval(rafraichir, RAFRAICHISSEMENT);
  }

  /** Fait apparaître les saisies des autres, sans déranger une saisie en cours. */
  function rafraichir() {
    if (document.hidden || !etat.session || !$('ecran-app').checkVisibility() || $('dlg-saisie').open) return;
    charger().catch(() => {});
  }

  async function charger() {
    const r = await api('liste');
    etat.moi = r.moi;
    etat.saisies = r.saisies;
    etat.categories = r.categories;
    etat.moyens = r.moyens;
    $('bonjour').textContent = 'Connecté(e) : ' + r.moi.nom;
    document.querySelectorAll('nav .admin').forEach(b => { b.hidden = r.moi.role !== 'admin'; });
    remplirMois();
    afficherListe();
  }

  // ====== Liste ======

  const centimes = m => Math.round(m * 100);
  const signe = s => (s.type === 'recette' ? 1 : -1);
  const total = (liste, type) => liste.filter(s => s.type === type).reduce((t, s) => t + centimes(s.montant), 0) / 100;
  const dateCourte = d => d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4);
  const horodatage = iso => new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }).replace(' ', ' à ');
  const nomMois = m => new Date(m + '-15').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

  function remplirMois() {
    const choix = $('filtre-mois');
    const valeur = choix.value;
    const mois = [...new Set(etat.saisies.map(s => s.date.slice(0, 7)))].sort().reverse();
    choix.replaceChildren(el('option', { value: '', textContent: 'Tous les mois' }),
      ...mois.map(m => el('option', { value: m, textContent: nomMois(m) })));
    if (mois.includes(valeur)) choix.value = valeur;
  }

  function saisiesFiltrees() {
    const q = $('recherche').value.trim().toLowerCase();
    const type = $('filtre-type').value;
    const mois = $('filtre-mois').value;
    return etat.saisies
      .filter(s => !type || s.type === type)
      .filter(s => !mois || s.date.startsWith(mois))
      .filter(s => !q || [s.description, s.categorie, s.auteur, s.moyen].join(' ').toLowerCase().includes(q))
      .sort((a, b) => b.date.localeCompare(a.date) || b.creee.localeCompare(a.creee));
  }

  function afficherListe() {
    const liste = saisiesFiltrees();
    const filtre = $('recherche').value || $('filtre-type').value || $('filtre-mois').value;
    $('solde').textContent = euros.format(total(etat.saisies, 'recette') - total(etat.saisies, 'depense'));
    $('recettes').textContent = euros.format(total(liste, 'recette'));
    $('depenses').textContent = euros.format(total(liste, 'depense'));
    $('titre-recettes').textContent = filtre ? 'Recettes (filtre)' : 'Recettes';
    $('titre-depenses').textContent = filtre ? 'Dépenses (filtre)' : 'Dépenses';

    if (!liste.length) {
      $('liste').replaceChildren(el('p', { className: 'vide', textContent:
        etat.saisies.length ? 'Aucune saisie ne correspond à ta recherche.' : 'Aucune saisie pour le moment. Ajoute la première !' }));
      return;
    }
    $('liste').replaceChildren(...liste.map(carteSaisie));
  }

  function carteSaisie(s) {
    const actions = [];
    if (s.justificatif) actions.push(el('button', { className: 'secondaire', textContent: 'Voir le justificatif', onclick: () => voirJustificatif(s) }));
    if (s.modifiable) {
      actions.push(el('button', { className: 'secondaire', textContent: 'Modifier', onclick: () => ouvrirSaisie(s) }));
      actions.push(el('button', { className: 'secondaire danger', textContent: 'Supprimer', onclick: () => supprimer(s) }));
    }
    return el('article', { className: 'saisie saisie-' + s.type },
      el('div', { className: 'saisie-haut' },
        el('h2', { textContent: s.description }),
        el('span', { className: 'montant ' + s.type, textContent: (s.type === 'recette' ? '+' : '−') + euros.format(s.montant) })),
      el('div', { className: 'infos', textContent: [dateCourte(s.date), s.categorie, s.moyen].join(' · ') }),
      el('div', { className: 'auteur' },
        s.auteur + ' a effectué cette saisie le ' + horodatage(s.creee),
        s.modifiee ? el('em', { textContent: 'Modifiée par ' + s.modifieePar + ' le ' + horodatage(s.modifiee) }) : null),
      actions.length ? el('div', { className: 'actions' }, ...actions) : null);
  }

  // ====== Ajout et modification ======

  function remplirCategories(selection) {
    const type = $('form-saisie').elements.type.value;
    $('form-saisie').elements.categorie.replaceChildren(el('option', { value: '', textContent: 'Choisir…' }),
      ...etat.categories[type].map(c => el('option', { value: c, textContent: c })));
    $('form-saisie').elements.categorie.value = selection || '';
  }

  function aujourdhui() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  function ouvrirSaisie(saisie) {
    const f = $('form-saisie');
    f.reset();
    etat.enEdition = saisie || null;
    $('titre-saisie').textContent = saisie ? 'Modifier la saisie' : 'Nouvelle saisie';
    $('erreur-saisie').hidden = true;
    $('aide-fichier').textContent = saisie && saisie.justificatif
      ? 'Un justificatif est déjà joint. Choisis un fichier seulement pour le remplacer.'
      : 'Photo du ticket ou de la facture, ou PDF (5 Mo maximum).';
    f.elements.moyen.replaceChildren(el('option', { value: '', textContent: 'Choisir…' }),
      ...etat.moyens.map(m => el('option', { value: m, textContent: m })));
    if (saisie) {
      f.elements.type.value = saisie.type;
      f.elements.montant.value = String(saisie.montant).replace('.', ',');
      f.elements.date.value = saisie.date;
      f.elements.description.value = saisie.description;
      f.elements.moyen.value = saisie.moyen;
    } else {
      f.elements.date.value = aujourdhui();
    }
    remplirCategories(saisie && saisie.categorie);
    $('dlg-saisie').showModal();
  }

  function lireBase64(blob) {
    return new Promise((resolve, reject) => {
      const lecteur = new FileReader();
      lecteur.onload = () => resolve(lecteur.result.split(',')[1]);
      lecteur.onerror = () => reject(new Error('Impossible de lire le fichier.'));
      lecteur.readAsDataURL(blob);
    });
  }

  /** Réduit les photos du téléphone pour que l'envoi reste rapide. */
  async function reduirePhoto(fichier) {
    const image = await createImageBitmap(fichier);
    const echelle = Math.min(1, COTE_MAX_PHOTO / Math.max(image.width, image.height));
    const canvas = el('canvas', { width: Math.round(image.width * echelle), height: Math.round(image.height * echelle) });
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
  }

  async function preparerFichier(fichier) {
    if (!fichier) return null;
    let contenu = fichier;
    if (fichier.type.startsWith('image/')) {
      try {
        contenu = await reduirePhoto(fichier);
      } catch (e) {
        throw new Error('Cette image n\'est pas lisible. Envoie une photo en JPEG ou PNG, ou un PDF.');
      }
    }
    if (contenu.size > TAILLE_MAX_FICHIER) throw new Error('Le justificatif dépasse 5 Mo.');
    return { type: contenu.type, donnees: await lireBase64(contenu) };
  }

  async function enregistrer(evenement) {
    evenement.preventDefault();
    const f = evenement.target.elements;
    const bouton = $('btn-enregistrer');
    $('erreur-saisie').hidden = true;
    bouton.disabled = true;
    bouton.textContent = 'Enregistrement…';
    try {
      const saisie = {
        type: f.type.value,
        montant: f.montant.value.replace(/\s/g, '').replace(',', '.'),
        date: f.date.value,
        categorie: f.categorie.value,
        description: f.description.value,
        moyen: f.moyen.value
      };
      const fichier = await preparerFichier(f.fichier.files[0]);
      if (etat.enEdition) await api('modifier', { id: etat.enEdition.id, saisie, fichier });
      else await api('ajouter', { saisie, fichier });
      $('dlg-saisie').close();
      await charger();
    } catch (err) {
      $('erreur-saisie').textContent = err.message;
      $('erreur-saisie').hidden = false;
    } finally {
      bouton.disabled = false;
      bouton.textContent = 'Enregistrer';
    }
  }

  async function supprimer(s) {
    if (!confirm('Supprimer « ' + s.description + ' » (' + euros.format(s.montant) + ') ?')) return;
    try {
      await api('supprimer', { id: s.id });
      await charger();
    } catch (err) {
      alert(err.message);
    }
  }

  async function voirJustificatif(s) {
    const apercu = $('apercu');
    const lien = $('lien-justif');
    apercu.hidden = true;
    lien.hidden = true;
    $('chargement-justif').textContent = 'Chargement…';
    $('chargement-justif').hidden = false;
    $('dlg-justificatif').showModal();
    try {
      const r = await api('justificatif', { id: s.id });
      const octets = Uint8Array.from(atob(r.donnees), c => c.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([octets], { type: r.type }));
      lien.href = url;
      lien.hidden = false;
      if (r.type.startsWith('image/')) {
        apercu.src = url;
        apercu.hidden = false;
      }
      $('chargement-justif').hidden = true;
    } catch (err) {
      $('chargement-justif').textContent = err.message;
    }
  }

  // ====== Export Excel ======

  /** Chargée seulement à l'export ; l'empreinte fait refuser tout fichier modifié. */
  function chargerExcelJS() {
    if (!etat.excel) {
      etat.excel = new Promise((resolve, reject) => {
        const script = el('script', { src: EXCELJS_URL, integrity: EXCELJS_EMPREINTE, crossOrigin: 'anonymous' });
        script.onload = () => resolve(window.ExcelJS);
        script.onerror = () => {
          etat.excel = null;
          reject(new Error('Impossible de préparer le fichier Excel. Vérifie ta connexion et réessaie.'));
        };
        document.head.append(script);
      });
    }
    return etat.excel;
  }

  const remplir = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + argb } });
  const couleursDe = categorie => COULEURS_CATEGORIES[categorie] || COULEUR_AUTRE;

  /** Regroupe dans l'ordre des catégories, chaque groupe du plus ancien au plus récent. */
  function parCategorie(saisies) {
    const connues = [...etat.categories.recette, ...etat.categories.depense];
    const autres = saisies.map(s => s.categorie).filter(c => !connues.includes(c));
    return [...new Set([...connues, ...autres])]
      .map(categorie => ({
        categorie,
        saisies: saisies.filter(s => s.categorie === categorie)
          .sort((a, b) => a.date.localeCompare(b.date) || a.creee.localeCompare(b.creee))
      }))
      .filter(groupe => groupe.saisies.length);
  }

  /** Colore une ligne entière : fond, texte en gras éventuel et filet du haut. */
  function colorerLigne(ligne, nbColonnes, { fond, texte, gras, filet }) {
    for (let c = 1; c <= nbColonnes; c++) {
      const cellule = ligne.getCell(c);
      if (fond) cellule.fill = remplir(fond);
      if (texte) cellule.font = { bold: !!gras, color: { argb: 'FF' + texte } };
      if (filet) cellule.border = { top: { style: 'thin', color: { argb: 'FF' + filet } } };
    }
  }

  function montantCellule(cellule, valeur, formule) {
    cellule.value = formule ? { formula: formule, result: valeur } : valeur;
    cellule.numFmt = FORMAT_EUROS;
  }

  const totalEn = (saisies) => saisies.reduce((t, s) => t + centimes(s.montant), 0) / 100;

  function construireClasseur(ExcelJS, saisies) {
    const classeur = new ExcelJS.Workbook();
    const feuille = classeur.addWorksheet('Transactions', {
      views: [{ state: 'frozen', ySplit: 7 }],
      pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
    });
    [12, 44, 15, 15, 19, 20].forEach((largeur, i) => { feuille.getColumn(i + 1).width = largeur; });

    feuille.mergeCells('A1:F1');
    feuille.getCell('A1').value = 'Trésorerie AS CY';
    feuille.getCell('A1').font = { bold: true, size: 15, color: { argb: 'FF17246B' } };
    feuille.mergeCells('A2:F2');
    feuille.getCell('A2').value = 'Export du ' + dateCourte(aujourdhui()) + ' · ' + saisies.length + ' transaction(s)';

    // Lignes 3 à 5 : récapitulatif, rempli une fois les totaux connus.
    feuille.getRow(7).values = ['Date', 'Description', 'Recette', 'Dépense', 'Moyen de paiement', 'Saisi par'];
    colorerLigne(feuille.getRow(7), 6, { fond: '17246B', texte: 'FFFFFF', gras: true });

    const resume = classeur.addWorksheet('Résumé');
    resume.columns = [{ width: 24 }, { width: 14 }, { width: 16 }];
    resume.addRow(['Catégorie', 'Transactions', 'Total']);
    colorerLigne(resume.getRow(1), 3, { fond: '17246B', texte: 'FFFFFF', gras: true });

    const totauxSections = {};
    SECTIONS_EXPORT.forEach(({ type, titre, fonce, clair, colonne }) => {
      const lettre = colonne === 3 ? 'C' : 'D';
      const liste = saisies.filter(s => s.type === type);
      if (!liste.length) return;

      feuille.addRow([]);
      const bandeau = feuille.addRow([titre]);
      feuille.mergeCells(bandeau.number, 1, bandeau.number, 6);
      bandeau.height = 24;
      bandeau.getCell(1).font = { bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
      bandeau.getCell(1).fill = remplir(fonce);
      bandeau.getCell(1).alignment = { vertical: 'middle' };

      const titreResume = resume.addRow([titre]);
      resume.mergeCells(titreResume.number, 1, titreResume.number, 3);
      titreResume.getCell(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
      titreResume.getCell(1).fill = remplir(fonce);

      const sousTotaux = [];
      parCategorie(liste).forEach(({ categorie, saisies: lignes }) => {
        const couleur = couleursDe(categorie);
        const titreCategorie = feuille.addRow([categorie]);
        feuille.mergeCells(titreCategorie.number, 1, titreCategorie.number, 6);
        titreCategorie.getCell(1).font = { bold: true, size: 12, color: { argb: 'FFFFFFFF' } };
        titreCategorie.getCell(1).fill = remplir(couleur.fonce);

        const debut = feuille.rowCount + 1;
        lignes.forEach(s => {
          const [annee, mois, jour] = s.date.split('-').map(Number);
          const ligne = feuille.addRow([new Date(Date.UTC(annee, mois - 1, jour)), s.description, null, null, s.moyen, s.auteur]);
          ligne.getCell(1).numFmt = 'dd/mm/yyyy';
          ligne.getCell(2).alignment = { wrapText: true, vertical: 'top' };
          colorerLigne(ligne, 6, { fond: couleur.clair });
          montantCellule(ligne.getCell(colonne), s.montant);
          ligne.getCell(colonne).font = { bold: true, color: { argb: 'FF' + fonce } };
        });

        const montant = totalEn(lignes);
        const sousTotal = feuille.addRow(['Total ' + categorie]);
        feuille.mergeCells(sousTotal.number, 1, sousTotal.number, 2);
        colorerLigne(sousTotal, 6, { fond: couleur.clair, texte: couleur.fonce, gras: true, filet: couleur.fonce });
        montantCellule(sousTotal.getCell(colonne), montant, 'SUM(' + lettre + debut + ':' + lettre + (feuille.rowCount - 1) + ')');
        sousTotaux.push(lettre + sousTotal.number);

        const ligneResume = resume.addRow([categorie, lignes.length, montant]);
        ligneResume.getCell(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
        ligneResume.getCell(1).fill = remplir(couleur.fonce);
        ligneResume.getCell(2).fill = remplir(couleur.clair);
        ligneResume.getCell(3).fill = remplir(couleur.clair);
        ligneResume.getCell(3).numFmt = FORMAT_EUROS;
      });

      const montantSection = totalEn(liste);
      const totalSection = feuille.addRow(['TOTAL ' + titre]);
      feuille.mergeCells(totalSection.number, 1, totalSection.number, 2);
      colorerLigne(totalSection, 6, { fond: fonce, texte: 'FFFFFF', gras: true });
      montantCellule(totalSection.getCell(colonne), montantSection, sousTotaux.join('+'));
      totauxSections[type] = { cellule: lettre + totalSection.number, montant: montantSection };

      const totalResume = resume.addRow(['Total ' + titre.toLowerCase(), liste.length, montantSection]);
      colorerLigne(totalResume, 3, { fond: clair, texte: fonce, gras: true });
      totalResume.getCell(3).numFmt = FORMAT_EUROS;
    });

    const recettes = totauxSections.recette || { montant: 0 };
    const depenses = totauxSections.depense || { montant: 0 };
    const solde = (centimes(recettes.montant) - centimes(depenses.montant)) / 100;
    [
      ['Total recettes', recettes.montant, recettes.cellule, '166534', 'DCFCE7'],
      ['Total dépenses', depenses.montant, depenses.cellule, '991B1B', 'FEE2E2'],
      ['Solde', solde, 'C3-C4', '17246B', 'DBEAFE']
    ].forEach(([libelle, valeur, formule, texte, fond], i) => {
      const ligne = feuille.getRow(3 + i);
      ligne.getCell(2).value = libelle;
      colorerLigne(ligne, 3, { fond, texte, gras: true });
      ligne.getCell(1).fill = { type: 'pattern', pattern: 'none' };
      montantCellule(ligne.getCell(3), valeur, formule);
    });

    const ligneSolde = resume.addRow(['Solde', saisies.length, solde]);
    colorerLigne(ligneSolde, 3, { fond: '17246B', texte: 'FFFFFF', gras: true });
    ligneSolde.getCell(3).numFmt = FORMAT_EUROS;
    return classeur;
  }

  async function exporter() {
    const bouton = $('btn-export');
    const saisies = saisiesFiltrees();
    if (!saisies.length) { alert('Aucune transaction à exporter.'); return; }
    bouton.disabled = true;
    bouton.textContent = 'Préparation…';
    try {
      const contenu = await construireClasseur(await chargerExcelJS(), saisies).xlsx.writeBuffer();
      const lien = el('a', {
        href: URL.createObjectURL(new Blob([contenu], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })),
        download: 'tresorerie-as-cy-' + aujourdhui() + '.xlsx'
      });
      lien.click();
      setTimeout(() => URL.revokeObjectURL(lien.href), 10000);
    } catch (err) {
      alert(err.message);
    } finally {
      bouton.disabled = false;
      bouton.textContent = 'Exporter';
    }
  }

  // ====== Administration ======

  function changerVue(vue) {
    ['saisies', 'acces', 'historique'].forEach(v => { $('vue-' + v).hidden = v !== vue; });
    document.querySelectorAll('nav button').forEach(b => {
      if (b.dataset.vue === vue) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    if (vue === 'acces') chargerAcces();
    if (vue === 'historique') chargerHistorique();
  }

  function erreurAcces(message) {
    $('erreur-acces').textContent = message || '';
    $('erreur-acces').hidden = !message;
  }

  async function chargerAcces() {
    erreurAcces();
    try {
      afficherAcces((await api('acces')).acces);
    } catch (err) {
      erreurAcces(err.message);
    }
  }

  function afficherAcces(acces) {
    $('liste-acces').replaceChildren(...acces.map(a => {
      const role = el('select', { 'ariaLabel': 'Rôle de ' + a.nom },
        el('option', { value: 'membre', textContent: 'Membre' }),
        el('option', { value: 'admin', textContent: 'Admin' }));
      role.value = a.role;
      role.onchange = () => enregistrerAcces({ ...a, role: role.value });
      return el('div', { className: 'acces' },
        el('div', {}, el('strong', { textContent: a.nom + (a.actif ? '' : ' (accès retiré)') }), el('small', { textContent: a.email })),
        role,
        el('button', {
          className: 'secondaire' + (a.actif ? ' danger' : ''),
          textContent: a.actif ? 'Retirer l\'accès' : 'Rétablir l\'accès',
          onclick: () => enregistrerAcces({ ...a, actif: !a.actif })
        }));
    }));
  }

  async function enregistrerAcces(acces) {
    erreurAcces();
    try {
      afficherAcces((await api('accesEnregistrer', { acces })).acces);
      return true;
    } catch (err) {
      erreurAcces(err.message);
      chargerAcces().catch(() => {});
      return false;
    }
  }

  async function chargerHistorique() {
    const zone = $('liste-historique');
    zone.replaceChildren(el('p', { className: 'vide', textContent: 'Chargement…' }));
    try {
      const { historique } = await api('historique');
      zone.replaceChildren(...(historique.length
        ? historique.map(h => el('div', { className: 'ligne-histo' },
            el('strong', { textContent: h.qui + ' · ' + h.action }),
            el('small', { textContent: horodatage(h.quand) }),
            h.detail))
        : [el('p', { className: 'vide', textContent: 'Rien pour le moment.' })]));
    } catch (err) {
      zone.replaceChildren(el('p', { className: 'erreur', textContent: err.message }));
    }
  }

  // ====== Démarrage ======

  $('btn-ajouter').onclick = () => ouvrirSaisie();
  $('btn-annuler').onclick = () => $('dlg-saisie').close();
  $('btn-fermer-justif').onclick = () => $('dlg-justificatif').close();
  $('btn-export').onclick = exporter;
  $('form-saisie').onsubmit = enregistrer;
  $('form-saisie').querySelectorAll('[name=type]').forEach(r => { r.onchange = () => remplirCategories(); });
  ['recherche', 'filtre-type', 'filtre-mois'].forEach(id => { $(id).oninput = afficherListe; });
  $('navigation').onclick = e => { if (e.target.dataset.vue) changerVue(e.target.dataset.vue); };
  $('btn-deconnexion').onclick = async () => {
    await api('deconnexion').catch(() => {});
    if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    afficherConnexion();
  };
  $('form-acces').onsubmit = async e => {
    e.preventDefault();
    const f = e.target.elements;
    if (await enregistrerAcces({ email: f.email.value, nom: f.nom.value, role: f.role.value, actif: true })) e.target.reset();
  };
  document.addEventListener('visibilitychange', rafraichir);

  if (etat.session) demarrer().catch(err => afficherConnexion(err.message));
  else afficherConnexion();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
